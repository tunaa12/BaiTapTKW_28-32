<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Form Validation Exercise</title>
<link rel="stylesheet" href="Styles/cau9.css">
</head>
<body>
<form id="regForm" novalidate>
<h3>Personal Information</h3>
<table>
<tr><td>Enter name*:</td><td><input type="text" id="name"></td></tr>
<tr><td>Sex*:</td><td><label><input type="radio" name="sex" value="Male"> Male</label>
<label><input type="radio" name="sex" value="Female"> Female</label></td></tr>
<tr><td>Enter email address*:</td><td><input type="text" id="email"></td></tr>
<tr><td>Enter birthday (MM/DD/YYYY)*:</td><td><input type="text" id="birthday"></td></tr>
<tr><td>Enter street address (line 1)*:</td><td><input type="text" id="street"></td></tr>
<tr><td>Enter city*:</td><td><input type="text" id="city"></td></tr>
<tr><td>Select a region*:</td><td><select id="region">
<option value="">-- Select --</option>
<option>North</option><option>Central</option><option>South</option></select></td></tr>
<tr><td>Enter 5-digit ZIP code*:</td><td><input type="text" id="zip"></td></tr>
<tr><td></td><td><button type="submit" id="btnFinish">Finish</button>
<button type="button" id="btnClear">Clear</button></td></tr>
</table>
</form>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>window.jQuery||document.write('<script src="Scripts/jquery.min.js"><\/script>')</script>
<script src="Scripts/cau9.js"></script>
</body>
</html>
